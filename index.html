<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년활동 계획서 자동생성</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            color: #333;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 14px;
        }

        table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        table input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
            padding: 12px 24px;
            margin-right: 10px;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c82333;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 14px;
        }

        .api-status {
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 10px;
        }

        .api-status.saved {
            background: #d4edda;
            color: #155724;
        }

        .api-status.empty {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .section {
                padding: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .btn-success {
                margin-right: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 청소년활동 계획서 자동생성</h1>
            <p>광양시청소년문화센터 | Claude AI 기반</p>
        </div>

        <div id="alertContainer"></div>

        <div class="section">
            <h2>🔑 Claude API 키 설정</h2>
            <div class="form-group">
                <label>API 키 (https://console.anthropic.com/api_keys 에서 발급)</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="sk-ant-xxxxxxxx"
                />
                <div id="apiStatus" class="api-status"></div>
            </div>
        </div>

        <div class="section">
            <h2>1️⃣ 기본 정보</h2>
            
            <div class="form-group">
                <label>활동명 *</label>
                <input 
                    type="text" 
                    id="activityName" 
                    placeholder="예: 2026년 청소년동아리 단합 활동"
                />
            </div>

            <div class="form-group">
                <label>활동 요약 (AI 생성용) *</label>
                <textarea 
                    id="activitySummary" 
                    rows="3" 
                    placeholder="예: 20명의 중학생과 고등학생이 팀별 경기를 통해 협력심과 단결력을 기르는 활동"
                ></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>날짜 *</label>
                    <input type="date" id="date" />
                </div>
                
                <div class="form-group">
                    <label>시작 시간</label>
                    <input type="time" id="startTime" value="10:00" />
                </div>

                <div class="form-group">
                    <label>종료 시간</label>
                    <input type="time" id="endTime" value="12:00" />
                </div>
            </div>

            <div class="form-group">
                <label>장소명 *</label>
                <input type="text" id="location" placeholder="예: 볼링장 및 센터 대강당" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>참여인원 (명)</label>
                    <input type="number" id="participants" value="20" />
                </div>
                <div class="form-group">
                    <label>남성 (명)</label>
                    <input type="number" id="male" value="10" />
                </div>
                <div class="form-group">
                    <label>여성 (명)</label>
                    <input type="number" id="female" value="10" />
                </div>
            </div>
        </div>

        <div class="section">
            <h2>2️⃣ AI로 자동 작성</h2>
            <button id="generateBtn" class="btn btn-primary">✨ 운영목적·목표·효과 생성</button>

            <div class="form-row">
                <div class="form-group">
                    <label>운영목적</label>
                    <textarea id="operatingPurpose" rows="3" placeholder="AI가 자동으로 작성합니다"></textarea>
                </div>

                <div class="form-group">
                    <label>운영목표</label>
                    <textarea id="operatingGoal" rows="3" placeholder="AI가 자동으로 작성합니다"></textarea>
                </div>

                <div class="form-group">
                    <label>기대효과</label>
                    <textarea id="expectedEffect" rows="3" placeholder="AI가 자동으로 작성합니다"></textarea>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>3️⃣ 세부 운영내용</h2>
            
            <table>
                <thead>
                    <tr>
                        <th>시작 시간</th>
                        <th>종료 시간</th>
                        <th>활동 내용</th>
                        <th>소요시간 (분)</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="scheduleTable">
                </tbody>
            </table>

            <button id="addScheduleBtn" class="btn btn-secondary">➕ 시간 추가</button>
        </div>

        <div class="section">
            <h2>4️⃣ 예산 및 법률</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>소요예산</label>
                    <input type="text" id="budget" value="243,000" />
                </div>

                <div class="form-group">
                    <label>청소년활동진흥법</label>
                    <select id="lawSection">
                        <option value="제4조">제4조 - 청소년운영위원회</option>
                        <option value="제5조">제5조 - 청소년활동의 지원</option>
                        <option value="제9조">제9조 - 학교와의 협력</option>
                        <option value="제64조" selected>제64조 - 청소년동아리활동의 활성화</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>예산 세부내용</label>
                <textarea id="budgetDetails" rows="3">식비 9,000원 * 27명 = 243,000원</textarea>
            </div>
        </div>

        <div class="section">
            <h2>5️⃣ 다운로드</h2>
            <div class="buttons">
                <button id="downloadHwpxBtn" class="btn btn-success">📥 HWPX 파일 다운로드</button>
                <button id="downloadTextBtn" class="btn btn-success">📄 텍스트 파일 다운로드</button>
                <button id="downloadJsonBtn" class="btn btn-success">📋 JSON 파일 다운로드</button>
            </div>
        </div>

        <div class="footer">
            <p>광양시청소년문화센터 | 청소년활동 자동계획서 생성 시스템 v1.0</p>
        </div>
    </div>

    <script>
        // ==================== 초기화 ====================
        const scheduleItems = [
            { startTime: '10:00', endTime: '10:10', activity: '오리엔테이션' },
            { startTime: '10:10', endTime: '11:30', activity: '메인 활동' },
            { startTime: '11:30', endTime: '12:00', activity: '마무리' }
        ];

        const lawsData = {
            "제4조": "청소년으로 구성되는 청소년운영위원회를 운영하여야 한다.",
            "제5조": "청소년은 다양한 청소년활동에 주체적이고 자발적으로 참여할 수 있다.",
            "제9조": "활동진흥원과 지방청소년활동진흥센터는 학교와의 협력체제를 구축하여야 한다.",
            "제64조": "국가 및 지방자치단체는 청소년이 자율적으로 참여하여 조직하고 운영하는 동아리활동을 적극 지원하여야 한다."
        };

        // ==================== localStorage 관련 ====================
        function saveApiKey(key) {
            localStorage.setItem('claudeApiKey', key);
            updateApiStatus();
        }

        function loadApiKey() {
            const key = localStorage.getItem('claudeApiKey');
            if (key) {
                document.getElementById('apiKey').value = key;
                updateApiStatus();
            }
        }

        function updateApiStatus() {
            const key = document.getElementById('apiKey').value;
            const status = document.getElementById('apiStatus');
            if (key.trim()) {
                status.className = 'api-status saved';
                status.textContent = '✅ API 키가 저장되었습니다. (자동 저장)';
            } else {
                status.className = 'api-status empty';
                status.textContent = '❌ API 키를 입력해주세요.';
            }
        }

        // API 키 입력 감지
        document.getElementById('apiKey').addEventListener('change', function() {
            saveApiKey(this.value);
        });

        document.getElementById('apiKey').addEventListener('blur', function() {
            saveApiKey(this.value);
        });

        // ==================== 시간 계산 ====================
        function calculateDuration(start, end) {
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            let duration = (eh * 60 + em) - (sh * 60 + sm);
            if (duration < 0) duration += 24 * 60;
            return duration;
        }

        // ==================== 스케줄 테이블 렌더링 ====================
        function renderScheduleTable() {
            const tbody = document.getElementById('scheduleTable');
            tbody.innerHTML = '';
            
            scheduleItems.forEach((item, index) => {
                const duration = calculateDuration(item.startTime, item.endTime);
                const row = `
                    <tr>
                        <td><input type="time" value="${item.startTime}" onchange="updateSchedule(${index}, 'startTime', this.value)" /></td>
                        <td><input type="time" value="${item.endTime}" onchange="updateSchedule(${index}, 'endTime', this.value)" /></td>
                        <td><input type="text" value="${item.activity}" onchange="updateSchedule(${index}, 'activity', this.value)" /></td>
                        <td>${duration}'</td>
                        <td><button class="btn btn-danger" onclick="removeSchedule(${index})">삭제</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function updateSchedule(index, field, value) {
            scheduleItems[index][field] = value;
            renderScheduleTable();
        }

        function removeSchedule(index) {
            scheduleItems.splice(index, 1);
            renderScheduleTable();
        }

        document.getElementById('addScheduleBtn').addEventListener('click', function() {
            scheduleItems.push({ startTime: '13:00', endTime: '14:00', activity: '새 활동' });
            renderScheduleTable();
        });

        // ==================== 알림 ====================
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = (type === 'error' ? '❌ ' : '✅ ') + message;
            alertContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        // ==================== Claude API 호출 ====================
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const apiKey = document.getElementById('apiKey').value;
            const activityName = document.getElementById('activityName').value;
            const activitySummary = document.getElementById('activitySummary').value;

            if (!apiKey.trim()) {
                showAlert('Claude API 키를 입력해주세요.', 'error');
                return;
            }

            if (!activityName || !activitySummary) {
                showAlert('활동명과 활동 요약을 입력해주세요.', 'error');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ 생성 중...';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-6',
                        max_tokens: 1024,
                        messages: [{
                            role: 'user',
                            content: `청소년문화센터의 활동 계획서를 위한 AI 작성 보조입니다.

활동명: ${activityName}
활동 요약: ${activitySummary}

위 활동을 바탕으로 다음 3가지를 한문단씩 작성해주세요. (각 1-2줄의 간결한 문장)

JSON 형식으로 다음과 같이 응답해주세요:
{
  "operatingPurpose": "운영목적 (1-2줄)",
  "operatingGoal": "운영목표 (1-2줄)",
  "expectedEffect": "기대효과 (1-2줄)"
}

주의: JSON 포맷만 응답하고 다른 설명은 넣지 마세요.`
                        }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API 오류: ${response.status} - ${errorData.error?.message || '알 수 없는 오류'}`);
                }

                const data = await response.json();
                const content = data.content[0].text;
                
                let jsonStr = content;
                if (content.includes('```json')) {
                    jsonStr = content.split('```json')[1].split('```')[0];
                } else if (content.includes('```')) {
                    jsonStr = content.split('```')[1].split('```')[0];
                }

                const result = JSON.parse(jsonStr.trim());
                document.getElementById('operatingPurpose').value = result.operatingPurpose;
                document.getElementById('operatingGoal').value = result.operatingGoal;
                document.getElementById('expectedEffect').value = result.expectedEffect;
                showAlert('AI가 운영목적, 운영목표, 기대효과를 생성했습니다.', 'success');
            } catch (err) {
                showAlert(`생성 실패: ${err.message}`, 'error');
            } finally {
                this.disabled = false;
                this.textContent = '✨ 운영목적·목표·효과 생성';
            }
        });

        // ==================== 텍스트 파일 다운로드 ====================
        document.getElementById('downloadTextBtn').addEventListener('click', function() {
            const activityName = document.getElementById('activityName').value;
            const date = document.getElementById('date').value;
            const location = document.getElementById('location').value;

            if (!activityName || !date || !location) {
                showAlert('필수 정보를 입력해주세요.', 'error');
                return;
            }

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const participants = document.getElementById('participants').value;
            const male = document.getElementById('male').value;
            const female = document.getElementById('female').value;
            const operatingPurpose = document.getElementById('operatingPurpose').value;
            const operatingGoal = document.getElementById('operatingGoal').value;
            const expectedEffect = document.getElementById('expectedEffect').value;
            const budget = document.getElementById('budget').value;
            const budgetDetails = document.getElementById('budgetDetails').value;
            const lawSection = document.getElementById('lawSection').value;

            const scheduleText = scheduleItems.map(item => {
                const duration = calculateDuration(item.startTime, item.endTime);
                return `${item.startTime} ~ ${item.endTime} (${duration}분): ${item.activity}`;
            }).join('\n');

            const content = `
═══════════════════════════════════════════════════════
청소년활동 계획서
═══════════════════════════════════════════════════════

📋 기본 정보
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
활동명: ${activityName}
날짜: ${date}
시간: ${startTime} ~ ${endTime}
장소: ${location}
참여인원: ${participants}명 (남 ${male}명, 여 ${female}명)

🎯 운영목적
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${operatingPurpose}

🎯 운영목표
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${operatingGoal}

✨ 기대효과
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${expectedEffect}

📊 세부 운영내용

        document.getElementById('downloadJsonBtn').addEventListener('click', function() {
            const activityName = document.getElementById('activityName').value;
            const date = document.getElementById('date').value;

            if (!activityName || !date) {
                showAlert('필수 정보를 입력해주세요.', 'error');
                return;
            }

            const data = {
                activityName: document.getElementById('activityName').value,
                date: document.getElementById('date').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                location: document.getElementById('location').value,
                participants: parseInt(document.getElementById('participants').value),
                male: parseInt(document.getElementById('male').value),
                female: parseInt(document.getElementById('female').value),
                operatingPurpose: document.getElementById('operatingPurpose').value,
                operatingGoal: document.getElementById('operatingGoal').value,
                expectedEffect: document.getElementById('expectedEffect').value,
                budget: document.getElementById('budget').value,
                budgetDetails: document.getElementById('budgetDetails').value,
                lawSection: document.getElementById('lawSection').value,
                schedule: scheduleItems,
                createdAt: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            saveAs(blob, `${activityName}_계획서_${date}.json`);
            showAlert('JSON 파일이 다운로드되었습니다.', 'success');
        });

        // ==================== HWPX 파일 생성 ====================
        document.getElementById('downloadHwpxBtn').addEventListener('click', async function() {
            const activityName = document.getElementById('activityName').value;
            const date = document.getElementById('date').value;

            if (!activityName || !date) {
                showAlert('필수 정보를 입력해주세요.', 'error');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ HWPX 생성 중...';

            try {
                await generateHWPX();
                showAlert('HWPX 파일이 다운로드되었습니다.', 'success');
            } catch (err) {
                showAlert(`HWPX 생성 실패: ${err.message}`, 'error');
            } finally {
                this.disabled = false;
                this.textContent = '📥 HWPX 파일 다운로드';
            }
        });

        // ==================== HWPX 생성 함수 ====================
        async function generateHWPX() {
            const activityName = document.getElementById('activityName').value;
            const date = document.getElementById('date').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const location = document.getElementById('location').value;
            const participants = document.getElementById('participants').value;
            const male = document.getElementById('male').value;
            const female = document.getElementById('female').value;
            const operatingPurpose = document.getElementById('operatingPurpose').value;
            const operatingGoal = document.getElementById('operatingGoal').value;
            const expectedEffect = document.getElementById('expectedEffect').value;
            const budget = document.getElementById('budget').value;
            const budgetDetails = document.getElementById('budgetDetails').value;
            const lawSection = document.getElementById('lawSection').value;

            // 스케줄 텍스트 생성
            const scheduleText = scheduleItems.map(item => {
                const duration = calculateDuration(item.startTime, item.endTime);
                return `${item.startTime}~${item.endTime}(${duration}분) ${item.activity}`;
            }).join('\n');

            // HWPX 파일 생성
            const zip = new JSZip();

            // [Content_Types].xml
            zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
    <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
    <Default Extension="xml" ContentType="application/xml"/>
    <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            // _rels/.rels
            zip.folder('_rels').file('.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            // word/document.xml (실제 내용)
            const wordXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" 
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
    <w:body>
        <w:p><w:r><w:t>청소년활동 계획서</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>활동명: ${activityName}</w:t></w:r></w:p>
        <w:p><w:r><w:t>날짜: ${date}</w:t></w:r></w:p>
        <w:p><w:r><w:t>시간: ${startTime} ~ ${endTime}</w:t></w:r></w:p>
        <w:p><w:r><w:t>장소: ${location}</w:t></w:r></w:p>
        <w:p><w:r><w:t>참여인원: ${participants}명 (남 ${male}명, 여 ${female}명)</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>운영목적</w:t></w:r></w:p>
        <w:p><w:r><w:t>${operatingPurpose}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>운영목표</w:t></w:r></w:p>
        <w:p><w:r><w:t>${operatingGoal}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>기대효과</w:t></w:r></w:p>
        <w:p><w:r><w:t>${expectedEffect}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>세부 운영내용</w:t></w:r></w:p>
        <w:p><w:r><w:t>${scheduleText.replace(/\n/g, '</w:t></w:r></w:p><w:p><w:r><w:t>')}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>예산: ${budget}</w:t></w:r></w:p>
        <w:p><w:r><w:t>${budgetDetails}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p><w:r><w:t>청소년활동진흥법: ${lawSection}</w:t></w:r></w:p>
        <w:p><w:r><w:t>${lawsData[lawSection]}</w:t></w:r></w:p>
    </w:body>
</w:document>`;

            zip.folder('word').file('document.xml', wordXml);

            // word/_rels/document.xml.rels
            zip.folder('word/_rels').file('document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
</Relationships>`);

            // 파일 생성
            const blob = await zip.generateAsync({ type: 'blob' });
            const activityName_input = document.getElementById('activityName').value;
            const date_input = document.getElementById('date').value;
            saveAs(blob, `${activityName_input}_계획서_${date_input}.hwpx`);
        }

        // ==================== 페이지 로드 ====================
        window.addEventListener('load', function() {
            loadApiKey();
            renderScheduleTable();
        });
    </script>
</body>
</html>
